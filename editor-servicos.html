<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar: Serviços</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    height:100svh;
    background:radial-gradient(ellipse at 8% 4%, #B8E8D4 0%, transparent 42%),
                radial-gradient(ellipse at 92% 6%, #AEE2E6 0%, transparent 42%),
                radial-gradient(ellipse at 6% 96%, #B4E4C0 0%, transparent 45%),
                radial-gradient(ellipse at 94% 94%, #ACE1DC 0%, transparent 45%),
                radial-gradient(ellipse at 50% 50%, #FAFDFB 0%, #E3F3EB 80%),
                linear-gradient(135deg, #EFF8F3, #E4F2EA 50%, #E0F0EC 100%);
    font-family:system-ui,sans-serif;
    position:relative;
    overflow:hidden;
  }

  .bg-circuit{position:fixed;inset:0;z-index:0;overflow:hidden;}
  .circuit-cluster{position:absolute;height:auto;overflow:visible;}

  .flow-cyan{
    stroke:#57D1D6;stroke-width:1.3;fill:none;stroke-linecap:round;
    vector-effect:non-scaling-stroke;
    stroke-dasharray:90 950;
    animation:flow 4.5s linear infinite;
    filter:drop-shadow(0 0 5px rgba(87,209,214,.95)) drop-shadow(0 0 12px rgba(87,209,214,.6));
  }
  .flow-green{
    stroke:#42C48C;stroke-width:1.3;fill:none;stroke-linecap:round;
    vector-effect:non-scaling-stroke;
    stroke-dasharray:90 950;
    animation:flow 4.5s linear infinite;
    filter:drop-shadow(0 0 5px rgba(66,196,140,.95)) drop-shadow(0 0 12px rgba(66,196,140,.6));
  }
  .slow{animation-duration:6.5s;}
  .fast{animation-duration:3s;}
  .rev{animation-direction:reverse;}
  @keyframes flow{to{stroke-dashoffset:-1040;}}

  .node-pulse{animation:nodePulse 2.6s ease-in-out infinite;}
  @keyframes nodePulse{0%,100%{opacity:.35;r:3;}50%{opacity:1;r:5.5;}}

  @media (prefers-reduced-motion: reduce){
    .flow-cyan,.flow-green{animation:none;filter:none;}
    .node-pulse{animation:none;}
  }

  /* ===== Menu flutuante (usado em todas as páginas) ===== */
  .menu-float{
    position:fixed;top:3px;right:20px;z-index:40;
  }
  .menu-toggle{
    width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.88);border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    flex-shrink:0;
    opacity:1;
    transition:opacity .25s ease, background .25s ease, box-shadow .25s ease;
  }
  .menu-toggle svg{width:22px;height:22px;}
  .menu-toggle svg circle, .menu-toggle svg line{stroke:#1B4332;}
  .menu-toggle svg circle{fill:#1B4332;}
  .menu-toggle:hover,
  .menu-toggle:focus-visible,
  .menu-toggle.active{
    opacity:1;
    background:#FFFFFF;
    box-shadow:0 4px 14px rgba(0,0,0,.15);
  }

  .menu-panel{
    position:fixed;top:0;right:0;height:100%;width:min(300px,82vw);
    background:#DFF0E4;border-left:1px solid rgba(27,67,50,.2);
    transform:translateX(100%);transition:transform .3s ease;
    display:flex;flex-direction:column;
    padding:36px 32px;z-index:60;
    overflow-y:auto;
  }
  .menu-panel.open{transform:translateX(0);}
  .menu-panel-logo{width:190px;height:auto;margin:8px 0 30px;display:block;}
  .menu-panel a{display:block;color:#1B4332;text-decoration:none;font-size:1.08rem;font-weight:600;padding:13px 0;border-bottom:1px solid rgba(27,67,50,.12);cursor:pointer;}
  .menu-panel a:hover{color:#2D9D6F;}
  .menu-more{border-bottom:1px solid rgba(27,67,50,.12);}
  .menu-more summary{
    display:flex;align-items:center;justify-content:space-between;
    color:#1B4332;font-size:1.08rem;font-weight:600;padding:13px 0;
    cursor:pointer;list-style:none;
  }
  .menu-more summary::-webkit-details-marker{display:none;}
  .menu-more summary::after{content:'+';font-size:1.3rem;color:#2D9D6F;transition:transform .2s ease;}
  .menu-more[open] summary::after{transform:rotate(45deg);}
  .menu-more .sub-links{padding:0 0 12px 12px;display:flex;flex-direction:column;}
  .menu-more .sub-links a{font-size:.96rem;font-weight:500;padding:9px 0;border-bottom:none;color:#3F4A46;}
  .menu-more .sub-links a:hover{color:#2D9D6F;}
  .close-btn{position:absolute;top:24px;right:28px;background:none;border:none;font-size:1.6rem;color:#1B4332;cursor:pointer;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:50;}
  .overlay.open{opacity:1;pointer-events:auto;}

  /* ===== Toast "Em breve" ===== */
  .toast{
    position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);
    background:#1B4332;color:#fff;padding:12px 22px;border-radius:30px;
    font-size:.92rem;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
    z-index:80;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ===== Páginas (mostra/esconde) ===== */
  .page-section{display:none;position:relative;z-index:5;}
  .page-section.active{display:block;}

  /* ===== HOME ===== */
  .home-topbar{
    position:fixed;top:0;left:0;right:0;height:50px;z-index:20;
    display:flex;align-items:center;
    padding:0 24px;
    background:linear-gradient(90deg,#1B4332,#215B41);
    box-shadow:0 2px 10px rgba(27,67,50,.15);
  }
  .home-topbar span{
    color:#FFFFFF;font-size:.82rem;font-weight:600;letter-spacing:.3px;opacity:.92;
  }

  /* ===== Botões de navegação do fluxo (rodapé) ===== */
  .flow-nav{
    position:fixed;left:0;right:0;bottom:18px;z-index:15;
    display:flex;justify-content:space-between;
    padding:0 18px;pointer-events:none;
  }
  .flow-btn{
    pointer-events:auto;
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.75);border:none;cursor:pointer;
    padding:10px 18px;border-radius:30px;
    box-shadow:0 4px 14px rgba(0,0,0,.12);
    color:#1B4332;font-family:system-ui,sans-serif;font-size:.86rem;font-weight:700;
    transition:background .2s ease, box-shadow .2s ease, transform .15s ease;
  }
  .flow-btn:hover{background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.2);transform:translateY(-2px);}
  .flow-btn svg{width:16px;height:16px;flex-shrink:0;}
  .hero-center{
    min-height:100vh;
    padding-top:190px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    position:relative;z-index:5;
  }
  .logo-wrap{display:block;width:100%;cursor:pointer;border:none;background:none;padding:0;position:relative;z-index:2;}
  .logo-wrap img{
    width:100%;height:auto;display:block;
    transition:transform .2s ease;
    animation:logoPulse 3.2s ease-in-out infinite;
  }
  .logo-wrap:hover img{transform:scale(1.02);animation-play-state:paused;}
  @keyframes logoPulse{
    0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(45,157,111,0));}
    50%{transform:scale(1.025);filter:drop-shadow(0 0 18px rgba(45,157,111,.28));}
  }
  @media (prefers-reduced-motion: reduce){
    .logo-wrap img{animation:none;}
  }

  /* ===== KeT — surge de trás da logo, ocupando o espaço acima ===== */
  .logo-stage{position:relative;width:min(560px,80vw);display:flex;justify-content:center;z-index:2;}
  .ket-wrap{
    position:absolute;left:50%;bottom:100%;margin-bottom:-10%;
    width:32%;z-index:1;pointer-events:none;
    opacity:0;transform:translateX(-50%) translateY(40px);
    animation:ketRise 1.2s cubic-bezier(.22,.9,.32,1) 1s forwards;
  }
  .ket-wrap img{width:100%;height:auto;display:block;filter:drop-shadow(0 12px 20px rgba(27,67,50,.18));}
  @keyframes ketRise{to{opacity:1;transform:translateX(-50%) translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .ket-wrap{animation:none;opacity:1;transform:translateX(-50%) translateY(0);}
  }
  @media (max-width:520px){
    .ket-wrap{width:38%;}
  }

  .promo-badge{
    display:flex;align-items:center;gap:10px;
    text-decoration:none;color:#1B4332;
    text-align:center;cursor:pointer;background:none;border:none;
  }
  .promo-badge .icon{width:26px;height:26px;flex-shrink:0;}
  .promo-badge .icon svg{width:100%;height:100%;display:block;}
  .promo-badge .txt{font-size:.86rem;font-weight:600;line-height:1.25;text-align:left;}
  .promo-badge .txt small{display:block;font-weight:500;color:#5A6B60;font-size:.74rem;}

  /* ===== Sobre Nós ===== */
  .sobre-page{
    padding:150px 24px 130px;max-width:720px;margin:0 auto;
  }
  .sobre-card{
    background:rgba(255,255,255,.62);
    border:1px solid rgba(255,255,255,.5);
    border-radius:20px;
    padding:34px 26px;
    box-shadow:0 10px 30px rgba(27,67,50,.10);
    backdrop-filter:blur(2px);
  }
  .sobre-title{
    font-family:'Space Grotesk',system-ui,sans-serif;
    font-size:clamp(1.7rem,5vw,2.3rem);font-weight:800;
    color:#16281E;margin-bottom:30px;text-align:center;
  }
  .sobre-page p{
    color:#243A30;font-size:1.06rem;line-height:1.75;margin-bottom:22px;
  }
  .sobre-page p:last-child{margin-bottom:0;}

  /* ===== Serviços / Plataformas (imagem com overlays) ===== */
  .services-page{
    padding:90px 20px 120px;
    max-width:650px;margin:0 auto;
    text-align:center;
  }
  .services-title{
    font-family:'Space Grotesk',system-ui,sans-serif;
    font-size:clamp(1.6rem,5vw,2.2rem);font-weight:800;
    color:#16281E;text-shadow:1px 1px 0 rgba(0,0,0,.08);
    margin-bottom:28px;
  }
  .services-page .img-wrap{position:relative;width:100%;}
  .services-page img{
    width:100%;height:auto;display:block;
  }
  .btn-hit{
    position:absolute;display:block;background:transparent;
    cursor:pointer;
  }
  .btn-hit:active{background:rgba(45,157,111,.18);border-radius:30px;}

  /* ===== Guias ===== */
  .page-content{
    padding:110px 24px 130px;
    max-width:1100px;margin:0 auto;
  }
  .intro-block{max-width:640px;margin:0 auto 64px;text-align:center;}
  .intro-logo{width:min(220px,50vw);height:auto;display:block;margin:0 auto 22px;}
  .intro-block p{color:#1B4332;font-size:1.28rem;line-height:1.55;font-weight:700;font-style:italic;}

  .guides-title{
    text-align:center;font-family:'Space Grotesk',system-ui,sans-serif;
    font-size:1.6rem;font-weight:700;color:#1B4332;margin-bottom:44px;
  }

  .guides-grid{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:46px 28px;
  }
  @media (max-width:820px){
    .guides-grid{grid-template-columns:1fr;max-width:380px;margin:0 auto;gap:56px;}
    .hero-center{padding-top:0;}
  }

  .guide-card{
    position:relative;
    background:linear-gradient(165deg,#EAF6EC,#D7ECDA);
    border:1px solid rgba(27,67,50,.22);
    border-radius:16px;
    padding:38px 22px 26px;
    box-shadow:0 10px 24px rgba(27,67,50,.08);
  }
  .guide-card .win-dots{
    position:absolute;top:10px;right:14px;
    font-family:'JetBrains Mono',monospace;font-size:.68rem;
    color:rgba(27,67,50,.4);letter-spacing:2px;
  }
  .guide-badge{
    position:absolute;top:-26px;left:50%;transform:translateX(-50%);
    width:54px;height:54px;border-radius:50%;
    background:#EAF6EC;border:3px solid #2D9D6F;
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',system-ui,sans-serif;
    font-weight:700;font-size:1.35rem;color:#1B4332;
    box-shadow:0 4px 12px rgba(27,67,50,.18);
  }
  .guide-card p{
    margin-top:22px;color:#33413B;font-size:.92rem;line-height:1.55;
    min-height:96px;
  }
  .guide-card .acessar-btn{
    display:inline-block;margin-top:20px;padding:11px 30px;
    border-radius:30px;text-decoration:none;
    background:linear-gradient(180deg,#3FBF7F,#1F7A4E);
    color:#fff;font-weight:700;font-size:.88rem;
    box-shadow:0 4px 10px rgba(27,67,50,.28);
    transition:transform .15s ease;cursor:pointer;border:none;
  }
  .guide-card .acessar-btn:hover{transform:translateY(-2px);}

  /* ===== Contatos (placeholder) ===== */
  .contatos-page{
    min-height:70vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
  }
  .contatos-page h1{
    font-family:'Space Grotesk',system-ui,sans-serif;
    font-size:clamp(1.6rem,5vw,2.2rem);font-weight:800;color:#16281E;margin-bottom:14px;
  }
  .contatos-page p{color:#3F4A46;font-size:1.05rem;}

  /* ===== Guias Essenciais (página individual) ===== */
  .page-wrap{
    position:relative;z-index:5;
    height:100svh;box-sizing:border-box;
    display:flex;flex-direction:column;
    padding:62px 20px 16px;
    max-width:640px;margin:0 auto;
  }
  .back-link{
    display:flex;align-items:center;gap:6px;flex-shrink:0;
    color:#1B4332;text-decoration:none;font-size:.86rem;font-weight:700;
    margin-bottom:14px;
  }
  .back-link svg{width:16px;height:16px;}
  .page-title{
    flex-shrink:0;
    font-family:'Space Grotesk',system-ui,sans-serif;
    font-size:clamp(1.25rem,4.5vw,1.7rem);font-weight:800;color:#16281E;
    margin-bottom:14px;
  }
  .content-card{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;
    background:linear-gradient(165deg,#EAF6EC,#D7ECDA);
    border:1px solid rgba(27,67,50,.22);
    border-radius:20px;
    padding:20px 20px 4px;
    box-shadow:0 10px 30px rgba(27,67,50,.10);
    overflow:hidden;
  }
  .text-scroll{
    flex:1;min-height:0;overflow-y:auto;
    color:#243A30;font-size:18px;line-height:1.6;
    padding-right:8px;padding-bottom:16px;
  }
  .text-scroll p{margin-bottom:14px;}
  .text-scroll p:last-child{margin-bottom:0;}
  .text-scroll::-webkit-scrollbar{width:6px;}
  .text-scroll::-webkit-scrollbar-thumb{background:rgba(27,67,50,.28);border-radius:10px;}

  .video-box{
    flex-shrink:0;margin-top:14px;height:min(30vh,220px);
    display:flex;justify-content:center;
  }
  .video-frame{
    width:min(30vh,220px);height:100%;aspect-ratio:1/1;
    border-radius:10px;overflow:hidden;
    background:#16281E;
    display:flex;align-items:center;justify-content:center;
  }
  .video-frame iframe{width:100%;height:100%;border:none;display:block;}
  .video-empty{
    text-align:center;color:#EAF6EC;padding:0 8px;
  }
  .video-empty b{display:block;font-size:.8rem;margin-bottom:3px;}
  .video-empty span{font-size:.68rem;opacity:.75;line-height:1.35;display:block;}

  /* ===== Desktop ===== */
  @media (min-width:900px){
    .page-wrap{max-width:760px;padding-top:80px;}
    .page-title{font-size:1.9rem;}
    .content-card{padding:28px 32px 4px;}
    .text-scroll{font-size:19px;max-width:640px;margin:0 auto;padding-right:14px;}
    .video-box{margin-top:22px;}
    .video-frame{width:min(32vh,280px);}
  }

  /* ===== Editor topo / barra de ferramentas ===== */
  .editor-topo{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    background:#F4F1E9;border:1.5px solid #DDD9CC;border-radius:10px;
    padding:8px;margin-bottom:16px;
  }
  .tb-btn{
    border:1.5px solid #DDD9CC;background:#fff;border-radius:6px;
    width:32px;height:32px;font-size:.9rem;cursor:pointer;color:#232722;
  }
  #toolbarTamanho{border:1.5px solid #DDD9CC;border-radius:6px;padding:6px;font-size:.8rem;background:#fff;}
  .tb-salvar,.tb-publicar{border:none;border-radius:8px;padding:9px 14px;font-size:.84rem;font-weight:700;cursor:pointer;}
  .tb-salvar{background:#fff;border:1.5px solid #075E45;color:#075E45;}
  .tb-publicar{background:#075E45;color:#fff;}

  /* ===== Canvas livre — cards sem posição fixa ===== */

const $ = s => document.querySelector(s);
let CFG = JSON.parse(localStorage.getItem('ti_admin_cfg_site') || 'null');

function atualizarStatusConexao(){
  return !!(CFG && CFG.token && CFG.owner && CFG.repo);
}

async function ghGet(path){
  const url = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${path}?ref=${CFG.branch}`;
  const res = await fetch(url, { cache:'no-store', headers:{ 'Authorization':`Bearer ${CFG.token}`, 'Accept':'application/vnd.github+json' } });
  if(res.status === 404) return null;
  if(!res.ok) throw new Error(`Erro ao carregar ${path} (${res.status})`);
  const data = await res.json();
  return { sha: data.sha, conteudo: decodeURIComponent(escape(atob(data.content.replace(/\n/g,'')))) };
}
async function ghGetSha(path){
  const url = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${path}?ref=${CFG.branch}`;
  const res = await fetch(url, { cache:'no-store', headers:{ 'Authorization':`Bearer ${CFG.token}`, 'Accept':'application/vnd.github+json' } });
  if(res.status === 404) return null;
  if(!res.ok) throw new Error(`Erro ao verificar ${path} (${res.status})`);
  const data = await res.json();
  return data.sha;
}
async function ghPut(path, conteudoTexto, sha, mensagem){
  const url = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${path}`;
  const body = { message: mensagem, content: btoa(unescape(encodeURIComponent(conteudoTexto))), branch: CFG.branch };
  if(sha) body.sha = sha;
  const res = await fetch(url, {
    method:'PUT',
    headers:{ 'Authorization':`Bearer ${CFG.token}`, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const err = await res.json().catch(()=>({}));
    throw new Error(err.message || `Erro ao publicar ${path} (${res.status})`);
  }
  return res.json();
}

/* ---------- Barra de formatação (mesma lógica de sempre) ---------- */
let rangeSalvo = null, elementoAtivo = null;
document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if(!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const container = range.commonAncestorContainer;
  const el = container.nodeType === 1 ? container : container.parentElement;
  const editavel = el ? el.closest('[contenteditable="true"]') : null;
  if(editavel){ rangeSalvo = range.cloneRange(); elementoAtivo = editavel; }
});
function restaurarSelecao(){
  if(!rangeSalvo || !elementoAtivo) return false;
  elementoAtivo.focus();
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(rangeSalvo);
  return true;
}
document.querySelectorAll('.tb-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if(!restaurarSelecao()) return;
    document.execCommand(btn.dataset.cmd);
    salvarRascunho();
  });
});
$('#toolbarTamanho').addEventListener('change', (e) => {
  const px = e.target.value;
  e.target.value = '';
  if(!px || !restaurarSelecao()) return;
  const sel = window.getSelection();
  if(sel.isCollapsed){
    if(elementoAtivo) elementoAtivo.style.fontSize = px + 'px';
  } else {
    const range = sel.getRangeAt(0);
    const span = document.createElement('span');
    span.style.fontSize = px + 'px';
    span.appendChild(range.extractContents());
    range.insertNode(span);
  }
  salvarRascunho();
});

/* ---------- Carregar / Salvar / Publicar ---------- */
async function carregarTudo(){
  const rascunho = localStorage.getItem(CHAVE_RASCUNHO);
  if(rascunho){
    try{
      LAYOUT = JSON.parse(rascunho);
      $('#draftMsg').textContent = 'Rascunho não publicado carregado — revise e toque em Publicar quando estiver pronto.';
      renderizarCanvas();
      return;
    }catch(e){}
  }
  if(!atualizarStatusConexao()) return;
  try{
    const arq = await ghGet(CAMINHO_LAYOUT);
    if(arq){
      SHA_LAYOUT = arq.sha;
      const m = arq.conteudo.match(/const SERVICOS_LAYOUT\s*=\s*(\{[\s\S]*\});/);
      if(m) LAYOUT = JSON.parse(m[1]);
    }
  }catch(e){}
  renderizarCanvas();
}
function salvarRascunho(){
  LAYOUT.titulo = $('#pageTitulo').textContent.trim();
  LAYOUT.subtitulo = $('#pageSubtitulo').textContent.trim();
  localStorage.setItem(CHAVE_RASCUNHO, JSON.stringify(LAYOUT));
}
$('#btnSalvarLocal').addEventListener('click', () => {
  salvarRascunho();
  $('#draftMsg').textContent = 'Alterações guardadas neste aparelho (ainda não publicadas).';
});
$('#btnPublicarTudo').addEventListener('click', async () => {
  const btn = $('#btnPublicarTudo');
  if(!atualizarStatusConexao()){ $('#draftMsg').textContent = 'Conecte ao GitHub primeiro (Painel Geral).'; return; }
  salvarRascunho();
  btn.disabled = true;
  try{
    const conteudo = `/* Layout da página Serviços. Gerado pelo Painel Administrativo. */\nconst SERVICOS_LAYOUT = ${JSON.stringify(LAYOUT, null, 2)};\n`;
    await ghPut(CAMINHO_LAYOUT, conteudo, SHA_LAYOUT, 'Atualiza layout: Serviços');
    SHA_LAYOUT = await ghGetSha(CAMINHO_LAYOUT);
    localStorage.removeItem(CHAVE_RASCUNHO);
    $('#draftMsg').textContent = 'Publicado com sucesso!';
  }catch(e){
    $('#draftMsg').textContent = 'Erro ao publicar: ' + e.message;
  }
  btn.disabled = false;
});

/* ---------- Canvas: cards livres pras 4 ferramentas ---------- */
function posicionarTexto(boxId, layoutKey, padraoLayout){
  const box = $('#' + boxId);
  const layout = Object.assign({}, padraoLayout, LAYOUT[layoutKey] || {});
  function aplicar(){
    box.style.top = layout.top + '%';
    box.style.left = layout.left + '%';
    box.style.width = layout.width + '%';
    LAYOUT[layoutKey] = layout;
  }
  aplicar();
  const handle = box.querySelector('.drag-handle-card');
  let modo = null, inicioX = 0, inicioY = 0, inicioLayout = null;
  handle.addEventListener('pointerdown', (e) => {
    if(e.target.isContentEditable) return;
    modo = true; inicioX = e.clientX; inicioY = e.clientY;
    inicioLayout = { top: layout.top, left: layout.left };
    e.preventDefault();
  });
  document.addEventListener('pointermove', (e) => {
    if(!modo) return;
    const rect = $('#canvasCards').getBoundingClientRect();
    layout.top = Math.max(0, Math.min(96, inicioLayout.top + ((e.clientY - inicioY) / rect.height) * 100));
    layout.left = Math.max(0, Math.min(90, inicioLayout.left + ((e.clientX - inicioX) / rect.width) * 100));
    aplicar();
  });
  document.addEventListener('pointerup', () => { if(modo){ modo = false; salvarRascunho(); } });
}
posicionarTexto('tituloBox', 'tituloLayout', {top:15.27, left:37.17, width:25.7});
posicionarTexto('subtituloBox', 'subtituloLayout', {top:19.5, left:20, width:60});

function renderizarCanvas(){
  $('#pageTitulo').textContent = LAYOUT.titulo || 'Serviços';
  $('#pageSubtitulo').textContent = LAYOUT.subtitulo || '';
  const cont = $('#canvasCards');
  cont.querySelectorAll('.canvas-card-item').forEach(el => el.remove());
  FERRAMENTAS.forEach((ferramenta, i) => cont.appendChild(criarTile(ferramenta, i)));
}

function criarTile(ferramenta, indice){
  const el = document.createElement('div');
  el.className = 'canvas-card-item';
  el.dataset.id = ferramenta.id;

  const layout = Object.assign({
    cardTop:0, cardLeft:0, cardWidth:40, cardHeight:15, ...ferramenta.padrao
  }, (LAYOUT.cards && LAYOUT.cards[ferramenta.id]) || {});

  el.innerHTML = `
    <div class="drag-handle-card" title="Arrastar / soltar em qualquer lugar">⠿⠿⠿</div>
    <div class="tile-conteudo">
      <span class="tile-titulo" contenteditable="true">${ferramenta.titulo}</span>
      <a class="tile-abrir" href="${ferramenta.link}">Abrir editor →</a>
    </div>
    <div class="card-resize-handle" title="Redimensionar"></div>`;

  function aplicarLayout(){
    el.style.top = layout.cardTop + '%';
    el.style.left = layout.cardLeft + '%';
    el.style.width = layout.cardWidth + '%';
    el.style.height = layout.cardHeight + '%';
    LAYOUT.cards = LAYOUT.cards || {};
    LAYOUT.cards[ferramenta.id] = layout;
  }
  aplicarLayout();

  const handle = el.querySelector('.drag-handle-card');
  const resizeHandle = el.querySelector('.card-resize-handle');
  const cont = $('#canvasCards');
  let modo = null, inicioX = 0, inicioY = 0, inicioLayout = null;
  function pxParaPercent(dx, dy){
    const rect = cont.getBoundingClientRect();
    return { dxPct: (dx / rect.width) * 100, dyPct: (dy / rect.height) * 100 };
  }
  handle.addEventListener('pointerdown', (e) => {
    if(e.target.isContentEditable) return;
    modo = 'mover'; inicioX = e.clientX; inicioY = e.clientY;
    inicioLayout = { top: layout.cardTop, left: layout.cardLeft };
    e.preventDefault();
  });
  resizeHandle.addEventListener('pointerdown', (e) => {
    modo = 'redimensionar'; inicioX = e.clientX; inicioY = e.clientY;
    inicioLayout = { width: layout.cardWidth, height: layout.cardHeight };
    e.stopPropagation(); e.preventDefault();
  });
  function mover(e){
    if(!modo) return;
    const { dxPct, dyPct } = pxParaPercent(e.clientX - inicioX, e.clientY - inicioY);
    if(modo === 'mover'){
      layout.cardTop = Math.max(0, Math.min(100 - layout.cardHeight, inicioLayout.top + dyPct));
      layout.cardLeft = Math.max(0, Math.min(100 - layout.cardWidth, inicioLayout.left + dxPct));
    } else {
      layout.cardWidth = Math.max(15, Math.min(100 - layout.cardLeft, inicioLayout.width + dxPct));
      layout.cardHeight = Math.max(10, Math.min(100 - layout.cardTop, inicioLayout.height + dyPct));
    }
    aplicarLayout();
  }
  document.addEventListener('pointermove', mover);
  function soltar(){ if(modo){ modo = null; salvarRascunho(); } }
  document.addEventListener('pointerup', soltar);

  el.querySelector('.tile-titulo').addEventListener('input', () => {
    ferramenta.titulo = el.querySelector('.tile-titulo').textContent.trim();
    salvarRascunho();
  });

  return el;
}

$('#pageTitulo').addEventListener('input', salvarRascunho);
$('#pageSubtitulo').addEventListener('input', salvarRascunho);

carregarTudo();

  const toggle = document.getElementById('menuToggle');
  const panel = document.getElementById('menuPanel');
  const overlay = document.getElementById('overlay');
  const closeBtn = document.getElementById('menuClose');
  function openMenu(){panel.classList.add('open');overlay.classList.add('open');}
  function closeMenu(){panel.classList.remove('open');overlay.classList.remove('open');}
  toggle.addEventListener('click', openMenu);
  if(closeBtn) closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', closeMenu);
</script>
